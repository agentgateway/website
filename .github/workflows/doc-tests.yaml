name: Doc tests

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'content/docs/**'
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      slack_notification:
        description: 'Send Slack notification'
        type: boolean
        default: false
      slack_channel:
        description: 'Slack channel to notify'
        type: string
        default: 'product-excellence-test-notifications'

jobs:
  discover:
    name: Discover test cases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      has_tests: ${{ steps.list.outputs.has_tests }}
      test_count: ${{ steps.list.outputs.test_count }}
      dev_version: ${{ steps.dev-version.outputs.dev_version }}
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml

      # The step below decides WHICH tests run, so a fault in it does not fail
      # the build, it empties it. That is the failure mode this whole job just
      # had, and it went unnoticed for as long as it existed, so the selector
      # is checked before it is used.
      - name: Test the changed-file resolver
        env:
          # `scripts/` is not gitignored for __pycache__, and a stray compiled
          # file here would show up in the tree of any job that later commits.
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Get changed markdown files
        id: changed-files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This step picks the tests. EVERY failure in it has to be loud,
          # because the shape of a selector's failure is an empty matrix and a
          # green check, not a red one -- that is the bug this job just had.
          # The default shell here is `bash -e`, which is not enough on its
          # own: `-e` ignores a failure anywhere but the END of a pipeline,
          # and the selection is a pipeline. Hence `pipefail`, and hence no
          # `|| true` anywhere below.
          set -o pipefail

          # No `|| true`. A flaky `gh api` used to leave this empty, and an
          # empty changed-file list is indistinguishable from "this PR changes
          # no docs" -- the run went green having tested nothing. A network
          # blip should cost a re-run, not a silent pass.
          ALL_CHANGED=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            --paginate --jq '.[].filename')

          # `grep` exits 1 when nothing matches, and "this PR touches no
          # markdown" is a normal outcome (a CSS or workflow-only PR), so it
          # is kept OUT of the pipeline below, where pipefail would read that
          # 1 as a failure. This is the one expected non-zero in the step, and
          # it is handled here rather than blanket-suppressed.
          CHANGED_MD=$(printf '%s\n' "$ALL_CHANGED" | grep -E '^(content|assets)/.*\.md$') \
            || CHANGED_MD=""

          # Map every changed markdown file to the content pages affected by
          # it: those that read it through a chain of `reuse` shortcodes, and
          # those whose front-matter `test:` block runs its code blocks as a
          # setup step.
          #
          # THIS USED TO MIRROR THE PATH, AND THE MIRROR WAS A CHECK THAT COULD
          # NOT FAIL. It stripped `assets/agw-docs/pages/` and tried the
          # remainder under each version root, with and without a
          # `documentation/` segment. Anything it could not place was announced
          # as "No content candidates found" and the job went green having run
          # nothing. That was 62 of the 134 snippets carrying doc tests: pages
          # under `integrations/`, snippets outside `assets/agw-docs/pages/`
          # which it never even tried, and -- the case that cannot be fixed by
          # adding prefixes -- snippets reached only through another snippet,
          # whose page shares no path segments with them at all.
          #
          # `reuse_consumers.py` reads the edges out of the files instead of
          # guessing, so a page moving cannot silently switch its tests off.
          # Its own tests run above, before it is trusted with the selection.
          #
          # Under pipefail a traceback out of the resolver now FAILS this step.
          # It previously could not: `|| true` forced the assignment to 0, so a
          # crash produced an empty list and the exact green-having-run-nothing
          # outcome the resolver was written to end.
          FILES=""
          UNRESOLVED_LOG="${RUNNER_TEMP}/unresolved.txt"
          : > "$UNRESOLVED_LOG"
          if [ -n "$CHANGED_MD" ]; then
            FILES=$(printf '%s\n' "$CHANGED_MD" \
              | python3 scripts/reuse_consumers.py --repo-root . --stdin 2>"$UNRESOLVED_LOG" \
              | tr '\n' ' ')
          fi

          # A changed file that reaches no page selects no tests. Usually
          # right -- five snippets in the tree are orphans no page reuses any
          # more -- but it is also what a genuine gap in the walk looks like,
          # so it is surfaced as a warning on the PR rather than left in the
          # log. NOT an error: an orphan edit is legitimate, and a check that
          # cries wolf on legitimate edits gets ignored, which is how the
          # original "No content candidates found" line went unread for so
          # long.
          if [ -s "$UNRESOLVED_LOG" ]; then
            echo "::warning::Changed files that reach no content page (no tests selected for them):"
            cat "$UNRESOLVED_LOG"
          fi

          # NOT `xargs` for the trim: it re-wraps its output at ~4096 characters, so a
          # large PR turned this into a MULTI-LINE value and `files=...` below then
          # failed with "Unable to process file command 'output'". Trim with sed, and
          # write through the heredoc form so the length cannot break the format.
          #
          # Guarded, and `printf` rather than the `grep -v '^$'` this used to drop
          # blanks with. Under the pipefail added above, that grep matches nothing on
          # an empty list, exits 1, and takes the whole step down -- which a CSS-only
          # PR hits, since the workflow's `paths:` filter includes all of `assets/**`.
          # Unquoted `$FILES` word-splits to one path per line and discards the blanks
          # on its own, so nothing in this pipeline can report failure for having had
          # no work to do.
          if [ -n "$FILES" ]; then
            FILES=$(printf '%s\n' $FILES | sort -u | tr '\n' ' ' \
              | sed -e 's/^ *//' -e 's/ *$//')
          fi
          {
            echo "files<<__CHANGED_FILES__"
            echo "$FILES"
            echo "__CHANGED_FILES__"
          } >> "$GITHUB_OUTPUT"
          # Hand the list to the next step through a FILE, one path per line. It cannot
          # travel through `env:`: Linux caps a single environment string at
          # MAX_ARG_STRLEN (128 KiB), and a PR touching a few thousand pages produces a
          # longer list than that, so execve fails with "Argument list too long" before
          # the next step's bash even starts. A file has no such cap.
          #
          # `> file` (truncate, don't write) when $FILES is empty: `printf '%s\n' $FILES`
          # still runs its format string once with no files at all, writing a single
          # blank line, which makes the file 1 byte. The next step's `[ -s file ]` check
          # then reads it as "there's a list" and takes the `--file` branch with zero
          # real entries, so `--file "${FILE_ARGS[@]}"` expands to a bare `--file` with
          # nothing after it and doc_test_run.py errors on a missing argument. A PR that
          # touches no content/*.md files (e.g. only go.mod, CSS, workflow files) hits
          # this on every run.
          if [ -n "$FILES" ]; then
            printf '%s\n' $FILES > "${RUNNER_TEMP}/changed-files.txt"
          else
            : > "${RUNNER_TEMP}/changed-files.txt"
          fi
          echo "$FILES" | tr ' ' '\n'

      - name: List test cases
        id: list
        run: |
          # Read the changed-file list from disk rather than an env var; see the note in
          # "Get changed markdown files". Each path becomes its own short argv entry, so
          # only the total (well under ARG_MAX) matters, not any single string's length.
          CHANGED_FILES_LIST="${RUNNER_TEMP}/changed-files.txt"
          if [ -s "$CHANGED_FILES_LIST" ]; then
            # A read loop rather than `mapfile`, which needs bash 4+ and so does not run
            # on a stock macOS shell if anyone reproduces this step locally.
            FILE_ARGS=()
            while IFS= read -r line; do
              [ -n "$line" ] && FILE_ARGS+=("$line")
            done < "$CHANGED_FILES_LIST"
            TESTS=$(python3 scripts/doc_test_run.py --repo-root . --list-tests --file "${FILE_ARGS[@]}")
          else
            TESTS=$(python3 scripts/doc_test_run.py --repo-root . --list-tests)
          fi
          COUNT=$(echo "$TESTS" | jq 'length')
          echo "test_count=${COUNT}" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi
          MATRIX=$(echo "$TESTS" | jq -c '(length | [., 40] | min) as $shards | . as $tests | {include: [range($shards) | . as $i | ([$tests | to_entries[] | select(.key % $shards == $i) | .value] as $shard | {shard_index: $i, test_count: ($shard | length), tests: ($shard | tojson), shard_name: ($shard | [.[].test] | join(", ") | if length > 80 then .[:77] + "..." else . end)})]}')
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Discovered $COUNT test case(s)"

      # Resolve an installable version for the development ("main"/experimental) install
      # snippets. Those pages install the nightly chart pinned in
      # assets/agw-docs/versions/patch-dev.md (normally the floating `0.0.0-latest-dev`).
      #
      # A failed upstream nightly (agentgateway/agentgateway) still publishes the
      # `0.0.0-latest-dev` chart, but with an `appVersion` pointing at a proxy image whose
      # build/push was skipped, so the image never lands in the registry. The deployer then
      # tries to pull a `v0.0.0-alpha.<sha>` image that does not exist -> ImagePullBackOff ->
      # every dev-channel doc test times out.
      #
      # We can do nothing to fix an upstream nightly, so instead of going red we resolve the
      # newest *fully published* build: keep `0.0.0-latest-dev` when its chart's image
      # actually exists, otherwise fall back to the most recent successful nightly's immutable
      # `0.0.0-alpha.<sha>` chart (which has both a chart and a matching image). Any failure in
      # this step falls back to the documented default, i.e. today's behavior.
      - name: Resolve installable dev build version
        id: dev-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REG=cr.agentgateway.dev
          CHART="oci://${REG}/charts/agentgateway"
          IMG="${REG}/agentgateway"
          UPSTREAM=agentgateway/agentgateway
          DEFAULT=$(cat assets/agw-docs/versions/patch-dev.md)
          RESOLVED="$DEFAULT"

          # True if the container image tag exists in the registry (anonymous, public).
          img_exists() { docker buildx imagetools inspect "${IMG}:$1" >/dev/null 2>&1; }

          # Echo a chart version's appVersion, or nothing if the chart tag does not exist.
          chart_appversion() {
            helm show chart "$CHART" --version "$1" 2>/dev/null \
              | awk -F': *' '/^appVersion:/ { gsub(/"/,"",$2); print $2; exit }'
          }

          # True if a chart version exists AND the proxy image its appVersion resolves to
          # exists. The deployer prefixes the appVersion with `v` when it is absent.
          installable() {
            local av; av=$(chart_appversion "$1")
            [ -n "$av" ] || return 1
            case "$av" in
              v*) img_exists "$av" ;;
              *)  img_exists "v$av" || img_exists "$av" ;;
            esac
          }

          if installable "$DEFAULT"; then
            echo "Default dev build '$DEFAULT' is installable; using it."
          else
            echo "Default dev build '$DEFAULT' is not installable (broken upstream nightly?); searching last successful nightly."
            RUN_IDS=$(gh run list --repo "$UPSTREAM" --workflow nightly.yml \
              --status success --limit 15 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
            for rid in $RUN_IDS; do
              # The nightly records its version as `Nightly version: 0.0.0-alpha.<sha>` in the log.
              # Capture the log first, then extract, so an early-exiting pipe (SIGPIPE under
              # `set -o pipefail`) can't fail the step.
              LOG=$(gh run view "$rid" --repo "$UPSTREAM" --log 2>/dev/null) || LOG=""
              # here-string + `grep -m1` avoids a pipe, so grep can't be killed by SIGPIPE
              # (which would fail the step under `set -o pipefail`); `|| true` covers no-match.
              VER=$(grep -m1 -oiE '0\.0\.0-alpha\.[0-9a-f]+' <<<"$LOG" || true)
              [ -n "$VER" ] || continue
              if installable "$VER"; then
                RESOLVED="$VER"
                echo "Falling back to last good nightly build '$VER' (run $rid)."
                break
              fi
            done
            if [ "$RESOLVED" = "$DEFAULT" ]; then
              echo "No installable fallback found; leaving default '$DEFAULT' in place."
            fi
          fi

          echo "dev_version=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Resolved dev build version: $RESOLVED"

  run-test:
    name: "${{ matrix.shard_name }}"
    needs: discover
    if: needs.discover.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install cloud-provider-kind
        run: go install sigs.k8s.io/cloud-provider-kind@latest

      - name: Install yamltest
        run: npm install -g yamltest@latest

      # Redirect the development install snippets to the version resolved in `discover`.
      # Only rewrites the checkout used by this run; the committed docs still ship
      # `0.0.0-latest-dev`. No-op when the default is already installable.
      - name: Pin dev build version
        if: needs.discover.outputs.dev_version != '' && needs.discover.outputs.dev_version != '0.0.0-latest-dev'
        run: |
          printf '%s' '${{ needs.discover.outputs.dev_version }}' > assets/agw-docs/versions/patch-dev.md
          echo "Pinned assets/agw-docs/versions/patch-dev.md to ${{ needs.discover.outputs.dev_version }} for this run."

      - name: Run doc tests
        env:
          SHARD_TESTS: ${{ matrix.tests }}
          DEBUG_MODE: true
          # Doc tests never call a real LLM provider: guides that configure one are
          # tested against a mock (httpbun in Kubernetes, a local mock LLM for the
          # standalone binary). Agentgateway fails to start when a `$VAR` reference
          # in a config cannot be resolved, so the variable still has to be set —
          # the value is deliberately a placeholder, not a secret.
          OPENAI_API_KEY: doc-tests-placeholder
          PYTHONUNBUFFERED: '1'
          # Used by the install-agentgateway-binary snippet's `gh run download` of the
          # nightly release-binary-linux artifact from agentgateway/agentgateway.
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILED=0
          TEST_INDEX=0
          # Read the test list on fd 3 and give each test run its own stdin
          # (</dev/null). Guides that run a command which reads stdin, such as
          # `kubectl exec -i` or `kubectl run -i`, would otherwise drain the
          # remaining lines of this loop's input, so the shard would stop early
          # and silently skip its remaining tests while still exiting 0.
          while IFS=$'\t' read -r -u 3 file test; do
            python3 scripts/doc_test_run.py --repo-root . --file "$file" --test "$test" \
              --report-file "out/tests/generated/shard/${TEST_INDEX}/test-results.yaml" \
              < /dev/null || FAILED=1
            TEST_INDEX=$((TEST_INDEX + 1))
          done 3< <(echo "$SHARD_TESTS" | jq -r '.[] | "\(.file)\t\(.test)"')
          python3 scripts/merge_test_results.py out/tests/generated/shard/ out/tests/generated/test-results.yaml

          # Every assigned test must have produced a report. A missing report
          # means the loop above did not run it, which must fail the shard
          # rather than pass with a short result set.
          EXPECTED=$(echo "$SHARD_TESTS" | jq 'length')
          if [ "$TEST_INDEX" -ne "$EXPECTED" ]; then
            echo "::error::Shard ran $TEST_INDEX of $EXPECTED assigned test(s)."
            FAILED=1
          fi
          exit $FAILED

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-result-${{ strategy.job-index }}
          path: out/tests/generated/test-results.yaml
          retention-days: 1

      - name: Upload test context (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-context-${{ strategy.job-index }}
          path: out/tests/generated/context/
          retention-days: 1
          if-no-files-found: ignore

  report:
    name: Aggregate results and report
    needs: [discover, run-test]
    if: always() && needs.discover.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-result-*
          path: collected-results/

      - name: Merge test results
        run: python3 scripts/merge_test_results.py collected-results/ out/tests/generated/test-results.yaml

      - name: Generate job summary
        id: summary
        run: |
          RESULTS_FILE=out/tests/generated/test-results.yaml

          # GitHub Step Summary (Markdown)
          python3 scripts/report_summary.py "$RESULTS_FILE" >> "$GITHUB_STEP_SUMMARY"

          # Slack Block Kit payload
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SLACK_PAYLOAD=$(python3 scripts/report_summary.py --slack --run-url "$RUN_URL" "$RESULTS_FILE")
          echo "slack_blocks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SLACK_PAYLOAD" | jq '.main' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "slack_thread_blocks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SLACK_PAYLOAD" | jq '.thread // empty' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slack_notification))
        uses: ./.github/actions/notify-slack
        with:
          message: "Doc Test Results"
          blocks: ${{ steps.summary.outputs.slack_blocks }}
          thread_blocks: ${{ steps.summary.outputs.slack_thread_blocks }}
          channel: ${{ github.event_name == 'workflow_dispatch' && inputs.slack_channel || 'product-excellence-test-notifications,doctopus-tests' }}
          token: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: List untested docs
        if: always()
        run: |
          python3 scripts/list_untested_docs.py \
            --docs-dir content/docs \
            --output out/tests/generated/untested-docs.txt

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doc-test-results
          path: out/tests/generated/
          retention-days: 14

      - name: Fail if any test failed
        env:
          # Number of test cases the discover job found. The merged report must
          # account for all of them, otherwise a test that never ran would be
          # indistinguishable from one that passed.
          EXPECTED_TESTS: ${{ needs.discover.outputs.test_count }}
        run: |
          python3 -c "
          import os, yaml, sys
          with open('out/tests/generated/test-results.yaml') as f:
              report = yaml.safe_load(f) or {}
          tests = report.get('tests', {})
          failed = [k for k, v in tests.items() if v.get('status') != 'passed']
          expected = int(os.environ.get('EXPECTED_TESTS') or 0)
          missing = expected - len(tests)
          if failed:
              print(f'{len(failed)} test(s) failed:', file=sys.stderr)
              for name in failed:
                  print(f'  - {name}', file=sys.stderr)
          if missing > 0:
              print(f'{missing} discovered test(s) produced no result:', file=sys.stderr)
              print(f'  discovered {expected}, reported {len(tests)}', file=sys.stderr)
          if failed or missing > 0:
              sys.exit(1)
          print(f'All {len(tests)} test(s) passed')
          "
