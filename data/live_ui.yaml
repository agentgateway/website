mcpServers:
  - name: github
    type: Streamable HTTP
    endpoint: https://api.githubcopilot.com/mcp/
    auth: OAuth (on-behalf-of)
    tools:
      - { name: search_issues,  desc: "Search issues and pull requests", args: '{ "q": "repo:agentgateway/agentgateway is:open label:bug" }' }
      - { name: get_pull_request, desc: "Fetch a pull request with its diff", args: '{ "owner": "agentgateway", "repo": "agentgateway", "number": 1203 }' }
      - { name: create_issue,   desc: "Open a new issue", args: '{ "owner": "agentgateway", "repo": "website", "title": "Docs: add MCP auth example" }', deny: true }
  - name: deepwiki
    type: Streamable HTTP
    endpoint: https://mcp.deepwiki.com/mcp
    auth: none
    tools:
      - { name: ask_question, desc: "Ask a question about a GitHub repo", args: '{ "repoName": "agentgateway/agentgateway", "question": "How does MCP multiplexing work?" }' }
      - { name: read_wiki_structure, desc: "List the wiki topics for a repo", args: '{ "repoName": "agentgateway/agentgateway" }' }
  - name: context7
    type: Streamable HTTP
    endpoint: https://mcp.context7.com/mcp
    auth: API key header
    tools:
      - { name: resolve-library-id, desc: "Find the Context7 ID for a library", args: '{ "libraryName": "gateway-api" }' }
      - { name: get-library-docs, desc: "Fetch up-to-date docs for a library", args: '{ "context7CompatibleLibraryID": "/kubernetes-sigs/gateway-api", "topic": "HTTPRoute" }' }
  - name: kubernetes
    type: stdio
    endpoint: npx -y mcp-server-kubernetes
    auth: in-cluster service account
    tools:
      - { name: pods_list, desc: "List pods in a namespace", args: '{ "namespace": "agentgateway-system" }' }
      - { name: pods_log, desc: "Read pod logs", args: '{ "namespace": "agentgateway-system", "name": "agentgateway-7d9c5", "tail": 20 }' }
      - { name: pods_delete, desc: "Delete a pod", args: '{ "namespace": "prod", "name": "checkout-6b7f" }', deny: true }
  - name: jira
    type: OpenAPI → MCP
    endpoint: https://acme.atlassian.net/rest/api/3
    auth: OAuth (on-behalf-of)
    tools:
      - { name: search, desc: "Search issues with JQL", args: '{ "jql": "project = PLAT AND status = \"In Progress\"" }' }
      - { name: get_issue, desc: "Fetch one issue", args: '{ "key": "PLAT-482" }' }

a2aAgents:
  - { name: triage-agent,   url: http://triage.agents.svc:8080, skills: 3 }
  - { name: release-notes,  url: http://release-notes.agents.svc:8080, skills: 1 }
