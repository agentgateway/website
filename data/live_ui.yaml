# Sample data for the interactive agentgateway UI on the homepage
# (layouts/partials/live-ui.html). Everything here is made up; nothing talks
# to a real gateway. Prices are USD per 1M tokens.

providers:
  - { id: openai,    name: OpenAI,         icon: /integrations/providers/openai.svg,    type: openai,    endpoint: api.openai.com,                              auth: API key secret }
  - { id: anthropic, name: Anthropic,      icon: /integrations/providers/anthropic.svg, type: anthropic, endpoint: api.anthropic.com,                           auth: API key secret }
  - { id: bedrock,   name: Amazon Bedrock, icon: /integrations/providers/bedrock.svg,   type: bedrock,   endpoint: bedrock-runtime.us-east-1.amazonaws.com,     auth: AWS IAM role }
  - { id: gemini,    name: Gemini,         icon: /integrations/providers/gemini.svg,    type: gemini,    endpoint: generativelanguage.googleapis.com,           auth: API key secret }
  - { id: vertex,    name: Vertex AI,      icon: /integrations/providers/vertex.svg,    type: vertex,    endpoint: us-central1-aiplatform.googleapis.com,       auth: GCP workload identity }
  - { id: azure,     name: Azure OpenAI,   icon: /integrations/providers/azure.svg,     type: azure,     endpoint: acme-prod.openai.azure.com,                  auth: Entra ID }
  - { id: mistral,   name: Mistral,        icon: /integrations/providers/mistral.svg,   type: openai,    endpoint: api.mistral.ai,                              auth: API key secret }
  - { id: ollama,    name: Ollama,         icon: /integrations/providers/ollama.svg,    type: openai,    endpoint: ollama.models.svc:11434,                     auth: none }

# color is used for charts (analytics) only.
models:
  - { name: gpt-5.6,           provider: openai,    upstream: gpt-5.6,                              in: 2.50, out: 15.00, cacheRead: 0.25, color: "#e0307a", policy: failover }
  - { name: gpt-5.4-mini,      provider: openai,    upstream: gpt-5.4-mini,                         in: 0.40, out: 1.60,  cacheRead: 0.04, color: "#2563eb", policy: none }
  - { name: claude-opus-5-5,   provider: anthropic, upstream: claude-opus-5-5,                      in: 5.00, out: 25.00, cacheRead: 0.50, color: "#d97757", policy: prompt cache }
  - { name: claude-sonnet-5-5, provider: bedrock,   upstream: us.anthropic.claude-sonnet-5-5-v1:0,  in: 3.00, out: 15.00, cacheRead: 0.30, color: "#7c3aed", policy: prompt cache }
  - { name: claude-haiku-5-5,  provider: anthropic, upstream: claude-haiku-5-5,                     in: 1.00, out: 5.00,  cacheRead: 0.10, color: "#a78bfa", policy: none }
  - { name: gemini-3-pro,      provider: gemini,    upstream: gemini-3-pro,                         in: 2.00, out: 12.00, cacheRead: 0.20, color: "#059669", policy: none }
  - { name: gemini-3-flash,    provider: vertex,    upstream: gemini-3-flash,                       in: 0.30, out: 2.50,  cacheRead: 0.03, color: "#14b8a6", policy: none }
  - { name: gpt-5.5-azure,     provider: azure,     upstream: gpt-5.5,                              in: 1.25, out: 10.00, cacheRead: 0.13, color: "#0ea5e9", policy: none }
  - { name: mistral-large-3,   provider: mistral,   upstream: mistral-large-latest,                 in: 2.00, out: 6.00,  cacheRead: 0.20, color: "#f59e0b", policy: none }
  - { name: qwen3-coder,       provider: ollama,    upstream: qwen3-coder:30b,                      in: 0.00, out: 0.00,  cacheRead: 0.00, color: "#64748b", policy: none }

virtualModels:
  - { name: fast,  targets: "gpt-5.4-mini → claude-haiku-5-5", strategy: failover }
  - { name: smart, targets: "claude-opus-5-5 70% · gpt-5.6 30%",  strategy: weighted }

