  - { name: Platform team,         team: platform,    env: prod, key: agw_sk_Lr7x6COW, budget: "monthly · $1,000", used: 0.31, models: unrestricted }
  - { name: Customer support bot,  team: support,     env: prod, key: agw_sk_tH4mKRwm, budget: "daily · 2M tokens", used: 0.64, models: "gpt-5.4-mini, claude-haiku-*" }
  - { name: Data science notebooks, team: data,       env: dev,  key: agw_sk_c1PkkCvD, budget: "monthly · $250",  used: 0.22, models: unrestricted }
