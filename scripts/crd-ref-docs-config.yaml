processor:
  ignoreGroupVersions:
    - gateway.networking.k8s.io/v1
    - gateway.networking.k8s.io/v1alpha2
    - gateway.networking.k8s.io/v1beta1
  ignoreTypes:
    - metav1.ObjectMeta
    - metav1.TypeMeta
    - metav1.ListMeta
    # Exclude Kubernetes List resource types (e.g. AgentgatewayBackendList)
    # - they duplicate the main resource with just metadata + items
    - "(AgentgatewayBackend|AgentgatewayParameters|AgentgatewayPolicy)List$"

render:
  kubernetesVersion: "1.31"
  # External Gateway API types referenced from agentgateway CRDs. Without these,
  # crd-ref-docs emits intra-page links to anchors that don't exist on the page,
  # which surface as broken anchors in the link checker.
  knownTypes:
    - name: SectionName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#sectionname
    - name: BackendObjectReference
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#backendobjectreference
    - name: HTTPHeaderName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#httpheadername
    - name: HTTPHeaderFilter
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#httpheaderfilter
    - name: Group
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#group
    - name: Kind
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#kind
    - name: ObjectName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#objectname
    - name: Namespace
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#namespace
    - name: PortNumber
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#portnumber
    - name: ParentReference
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#parentreference
    - name: LocalPolicyTargetReferenceWithSectionName
      package: sigs.k8s.io/gateway-api/apis/v1alpha2
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#localpolicytargetreferencewithsectionname
    - name: LocalPolicyTargetSelectorWithSectionName
      package: sigs.k8s.io/gateway-api/apis/v1alpha2
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#localpolicytargetselectorwithsectionname
    # NOTE: knownTypes cannot override types from k8s.io/api, k8s.io/apimachinery,
    # or k8s.io/apiextensions-apiserver. In crd-ref-docs, LinkForType checks
    # IsKubeType before IsKnownType (renderer/functions.go), so those packages
    # always get the templated kubernetes.io/docs/reference/generated URL and any
    # knownTypes entry for them is silently ignored. Entries for PullPolicy and
    # metav1.Duration used to live here and never took effect. When a generated
    # kubernetes.io anchor is broken (for example #pullpolicy-v1-core, which is a
    # type alias with no section of its own), add a sed to the post-processing
    # block in the "Generate API docs" step of .github/workflows/reference-docs.yaml
    # instead. Do not patch the generated api-*.md files by hand: the next regen
    # reverts the edit, and the regen runs nightly.
    #
    # Reserve those rewrites for links that are genuinely wrong for a reader.
    # Links that merely redirect (git.k8s.io, for one) belong in the exclude list
    # in docs-link-checking/lychee.toml, not here: rewriting them pins a URL that
    # can rot, which is worse than the redirect.
