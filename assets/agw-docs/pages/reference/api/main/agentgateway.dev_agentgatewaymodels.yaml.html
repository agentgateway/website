<template data-ks-field-panel="p133"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string[]</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Remove the given header(s) from the HTTP request before the action. The<br />value of Remove is a list of HTTP header names. Note that the header<br />names are case-insensitive (see<br />https://datatracker.ietf.org/doc/html/rfc2616#section-4.2).</div><div class="ks-rich-block">Input:<br />  GET /foo HTTP/1.1<br />  my-header1: foo<br />  my-header2: bar<br />  my-header3: baz</div><div class="ks-rich-block">Config:<br />  remove: [&quot;my-header1&quot;, &quot;my-header3&quot;]</div><div class="ks-rich-block">Output:<br />  GET /foo HTTP/1.1<br />  my-header2: bar</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Max items</span><span class="ks-validation-value">16</span></div><div class="ks-validation-item"><span class="ks-validation-label">List type</span><span class="ks-validation-value">set</span></div></div></details></div></template>
<template data-ks-field-panel="p134"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object[]</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Set overwrites the request with the given header (name, value)<br />before the action.</div><div class="ks-rich-block">Input:<br />  GET /foo HTTP/1.1<br />  my-header: foo</div><div class="ks-rich-block">Config:<br />  set:<br />  - name: &quot;my-header&quot;<br />    value: &quot;bar&quot;</div><div class="ks-rich-block">Output:<br />  GET /foo HTTP/1.1<br />  my-header: bar</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Max items</span><span class="ks-validation-value">16</span></div><div class="ks-validation-item"><span class="ks-validation-label">List type</span><span class="ks-validation-value">map</span></div><div class="ks-validation-item"><span class="ks-validation-label">List map keys</span><span class="ks-validation-value">name</span></div></div></details></div></template>

<template data-ks-field-panel="p137"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Settings for evicting unhealthy backends.</div></div><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (1)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/llm/models/virtual/">documentation/llm/models/virtual</a></div></div></details></div></template>
<template data-ks-field-panel="p138"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-integer">integer</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Number of consecutive unhealthy responses required before the backend is evicted.<br />For example, a value of 5 means the backend must receive 5 unhealthy responses in a row before being evicted.<br />When both consecutiveFailures and healthThreshold are set, the backend is evicted when either condition is met.<br />When neither is set, a single unhealthy response can trigger eviction.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Format</span><span class="ks-validation-value">int32</span></div><div class="ks-validation-item"><span class="ks-validation-label">Minimum</span><span class="ks-validation-value">0</span></div></div></details><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (1)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/llm/models/virtual/">documentation/llm/models/virtual</a></div></div></details></div></template>
<template data-ks-field-panel="p139"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Base time a backend should be evicted after being marked unhealthy.<br />Subsequent evictions use multiplicative backoff (duration * times_evicted).<br />If all endpoints are evicted, the load balancer falls back to returning evicted endpoints<br />rather than failing entirely.<br />If unset, defaults to <code class="ks-inline-code">3s</code>.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Pattern</span><span class="ks-validation-value">^([0-9]{1,5}(h|m|s|ms)){1,4}$</span></div><div class="ks-validation-item"><span class="ks-validation-label">Max length</span><span class="ks-validation-value">32</span></div><div class="ks-validation-item"><span class="ks-validation-label">Rule</span><div class="ks-validation-value ks-validation-value-block">duration must be at least 1 second</div></div></div></details></div></template>
<template data-ks-field-panel="p140"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-integer">integer</span></div><div class="ks-detail-desc"><div class="ks-rich-block">EWMA health score threshold, from 0 to 100. When set, a backend is evicted<br />only if its computed health drops below this value after an unhealthy<br />response (e.g. 50 evicts when EWMA health falls below 50%). Unlike<br />consecutiveFailures, this sliding-window average lets a single success delay<br />eviction. If both are set, either condition evicts; if neither, a single<br />unhealthy response evicts.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Format</span><span class="ks-validation-value">int32</span></div><div class="ks-validation-item"><span class="ks-validation-label">Minimum</span><span class="ks-validation-value">0</span></div><div class="ks-validation-item"><span class="ks-validation-label">Maximum</span><span class="ks-validation-value">100</span></div></div></details></div></template>
<template data-ks-field-panel="p141"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-integer">integer</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Health score from 0 to 100 assigned to a backend when it returns from eviction.<br />For gradual recovery, set below 100; for full recovery immediately, set 100.<br />If unset, the backend resumes with the health it had when evicted.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Format</span><span class="ks-validation-value">int32</span></div><div class="ks-validation-item"><span class="ks-validation-label">Minimum</span><span class="ks-validation-value">0</span></div><div class="ks-validation-item"><span class="ks-validation-label">Maximum</span><span class="ks-validation-value">100</span></div></div></details></div></template>
<template data-ks-field-panel="p142"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">CEL expression that determines whether a response indicates an unhealthy backend.<br />When the expression evaluates to true, the backend is considered unhealthy and may be evicted.</div><div class="ks-rich-block">For example, to evict on 5xx responses: <code class="ks-inline-code">response.code &gt;= 500</code>.</div><div class="ks-rich-block">When unset, any 5xx response, or a connection failure, is treated as unhealthy.<br />This default lowers the backend's health score but does not trigger eviction on its own.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Min length</span><span class="ks-validation-value">1</span></div><div class="ks-validation-item"><span class="ks-validation-label">Max length</span><span class="ks-validation-value">16384</span></div></div></details></div></template>
<template data-ks-field-panel="p143"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Guardrails for requests and responses sent to this model provider.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Rule</span><div class="ks-validation-value ks-validation-value-block">at least one of the fields in [request response] must be set</div></div></div></details></div></template>
<template data-ks-field-panel="p144"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object[]</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Prompt guards to apply to requests sent by the client.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Min items</span><span class="ks-validation-value">1</span></div><div class="ks-validation-item"><span class="ks-validation-label">Max items</span><span class="ks-validation-value">8</span></div></div></details></div></template>
<template data-ks-field-panel="p145"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">AWS Bedrock Guardrails settings for prompt<br />guarding.</div></div></div></template>
<template data-ks-field-panel="p146"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Action controls whether the guardrail's verdict is enforced or only<br />observed. <code class="ks-inline-code">Reject</code> (the default) enforces the guardrail: a blocked<br />assessment rejects the request/response and an anonymized assessment masks<br />the matched content. <code class="ks-inline-code">Audit</code> runs the guardrail in observe mode: it is<br />invoked and its assessment recorded (metrics + structured log), but the<br />request/response is never blocked or masked.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Enum</span><span class="ks-validation-value">Audit, Reject</span></div></div></details></div></template>
<template data-ks-field-panel="p147"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Behavior when the provider is unavailable or returns an error.<br /><code class="ks-inline-code">FailOpen</code> allows the request to continue; <code class="ks-inline-code">FailClosed</code> (default) rejects it.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Enum</span><span class="ks-validation-value">FailClosed, FailOpen</span></div></div></details></div></template>

<template data-ks-field-panel="p257"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object[]</span><span class="ks-detail-required">Required</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Conditions describes the status of the route with respect to the Gateway.<br />Note that the route's availability is also subject to the Gateway's own<br />status conditions and listener status.</div><div class="ks-rich-block">If the Route's ParentRef specifies an existing Gateway that supports<br />Routes of this kind AND that Gateway's controller has sufficient access,<br />then that Gateway's controller MUST set the &quot;Accepted&quot; condition on the<br />Route, to indicate whether the route has been accepted or rejected by the<br />Gateway, and why.</div><div class="ks-rich-block">A Route MUST be considered &quot;Accepted&quot; if at least one of the Route's<br />rules is implemented by the Gateway.</div><div class="ks-rich-block">There are a number of cases where the &quot;Accepted&quot; condition may not be set<br />due to lack of controller visibility, that includes when:</div><div class="ks-rich-block">* The Route refers to a nonexistent parent.<br />* The Route is of a type that the controller does not support.<br />* The Route is in a namespace to which the controller does not have access.</div><div class="ks-rich-block">&lt;gateway:util:excludeFromCRD&gt;</div><div class="ks-rich-block">Notes for implementors:</div><div class="ks-rich-block">Conditions are a listType <code class="ks-inline-code">map</code>, which means that they function like a<br />map with a key of the <code class="ks-inline-code">type</code> field _in the k8s apiserver_.</div><div class="ks-rich-block">This means that implementations must obey some rules when updating this<br />section.</div><div class="ks-rich-block">* Implementations MUST perform a read-modify-write cycle on this field<br />  before modifying it. That is, when modifying this field, implementations<br />  must be confident they have fetched the most recent version of this field,<br />  and ensure that changes they make are on that recent version.<br />* Implementations MUST NOT remove or reorder Conditions that they are not<br />  directly responsible for. For example, if an implementation sees a Condition<br />  with type <code class="ks-inline-code">special.io/SomeField</code>, it MUST NOT remove, change or update that<br />  Condition.<br />* Implementations MUST always _merge_ changes into Conditions of the same Type,<br />  rather than creating more than one Condition of the same Type.<br />* Implementations MUST always update the <code class="ks-inline-code">observedGeneration</code> field of the<br />  Condition to the <code class="ks-inline-code">metadata.generation</code> of the Gateway at the time of update creation.<br />* If the <code class="ks-inline-code">observedGeneration</code> of a Condition is _greater than_ the value the<br />  implementation knows about, then it MUST NOT perform the update on that Condition,<br />  but must wait for a future reconciliation and status update. (The assumption is that<br />  the implementation's copy of the object is stale and an update will be re-triggered<br />  if relevant.)</div><div class="ks-rich-block">&lt;/gateway:util:excludeFromCRD&gt;</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Min items</span><span class="ks-validation-value">1</span></div><div class="ks-validation-item"><span class="ks-validation-label">Max items</span><span class="ks-validation-value">8</span></div><div class="ks-validation-item"><span class="ks-validation-label">List type</span><span class="ks-validation-value">map</span></div><div class="ks-validation-item"><span class="ks-validation-label">List map keys</span><span class="ks-validation-value">type</span></div></div></details></div></template>

</div>

<script>
(() => {
  const host = document.getElementById("ks-widget-1");
  const template = document.getElementById("ks-widget-1-template");
  if (!host || !template || host.dataset.ksWidgetReady === "true") {
    return;
  }
  host.dataset.ksWidgetReady = "true";

  const shadow = host.shadowRoot || host.attachShadow({ mode: "open" });
  shadow.innerHTML = "";
  shadow.appendChild(template.content.cloneNode(true));

  const root = shadow.querySelector(".ks-schema");
  if (!root) {
    return;
  }

  // Dark mode sync: mirror Hextra's html.dark class onto the shadow root so
  // the encapsulated CSS can react. MutationObserver covers theme toggling.
  const docEl = document.documentElement;
  const syncDark = () => {
    root.classList.toggle("ks-dark", docEl.classList.contains("dark"));
  };
  syncDark();
  new MutationObserver(syncDark).observe(docEl, { attributes: true, attributeFilter: ["class"] });

  // The search index is read out of the tree rather than shipped beside it.
  // Every field of an entry is already an attribute on the row, and the literal
  // cost ~170 bytes per field, which on the standalone config schema was 4.8 MB
  // of the page. querySelectorAll returns document order, so entries[0] is
  // still the root field.
  const entries = Array.from(shadow.querySelectorAll(".ks-row-line[data-ks-path]")).map((element) => {
    const badge = element.querySelector(".ks-type");
    return {
      nodeId: element.id,
      path: element.getAttribute("data-ks-path"),
      propType: badge ? badge.textContent : "",
    };
  });
  const input = shadow.querySelector("[data-ks-search-input]");
  const results = shadow.querySelector("[data-ks-search-results]");
  const detailPanel = shadow.querySelector("[data-ks-active-panel]");
  if (!input || !results || entries.length === 0) {
    return;
  }
  const nodeByID = new Map();
  const childrenByID = new Map();
  const panelTemplateByID = new Map();
  shadow.querySelectorAll(".ks-row-line[id]").forEach((element) => {
    nodeByID.set(element.id, element);
  });
  shadow.querySelectorAll("[data-ks-children-container]").forEach((element) => {
    childrenByID.set(element.id, element);
  });
  shadow.querySelectorAll("[data-ks-field-panel]").forEach((element) => {
    panelTemplateByID.set(element.getAttribute("data-ks-field-panel"), element);
  });
  const entryByPath = new Map(entries.map((entry) => [normalize(entry.path), entry]));
  const typeButtons = shadow.querySelectorAll(".ks-type-toggle[data-ks-children-target]");
  const toggleByTarget = new Map();
  typeButtons.forEach((element) => {
    toggleByTarget.set(element.getAttribute("data-ks-children-target"), element);
  });

  let matches = [];
  let activeIndex = -1;
  let highlightTimer = 0;
  let activeNodeId = "";

  function normalize(value) {
    return value.toLowerCase().trim().replace(/^\./, "");
  }

  function scoreSegment(query, target) {
    if (!query) {
      return 0;
    }
    let qi = 0;
    let score = 0;
    let streak = 0;
    let lastIndex = -1;
    for (let i = 0; i < target.length && qi < query.length; i += 1) {
      if (target[i] !== query[qi]) {
        continue;
      }
      score += 1;
      if (i === 0) {
        score += 12;
      }
      if (lastIndex === i - 1) {
        streak += 1;
        score += 8 + Math.min(streak, 4);
      } else {
        streak = 0;
      }
      lastIndex = i;
      qi += 1;
    }
    if (qi !== query.length) {
      return -1;
    }
    if (target.startsWith(query)) {
      score += 18;
    }
    return score - (target.length - query.length);
  }

  function fuzzyScore(query, target) {
    const queryParts = normalize(query).split(".").filter(Boolean);
    const targetParts = normalize(target).split(".").filter(Boolean);
    if (queryParts.length === 0) {
      return -1;
    }

    let total = 0;
    let searchFrom = 0;
    for (const queryPart of queryParts) {
      let bestIndex = -1;
      let bestScore = -1;
      for (let i = searchFrom; i < targetParts.length; i += 1) {
        const partScore = scoreSegment(queryPart, targetParts[i]);
        if (partScore > bestScore) {
          bestIndex = i;
          bestScore = partScore;
        }
        if (targetParts[i].startsWith(queryPart)) {
          break;
        }
      }
      if (bestIndex === -1 || bestScore < 0) {
        return -1;
      }
      total += bestScore;
      if (bestIndex === searchFrom) {
        total += 6;
      }
      searchFrom = bestIndex + 1;
    }

    const normalizedTarget = normalize(target);
    const normalizedQuery = normalize(query);
    if (normalizedTarget.startsWith(normalizedQuery)) {
      total += 24;
    }
    return total - Math.max(0, targetParts.length - queryParts.length);
  }

  function escapeHtml(value) {
    return value
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function hideResults() {
    results.hidden = true;
    results.innerHTML = "";
    matches = [];
    activeIndex = -1;
  }

  function setActiveIndex(nextIndex) {
    activeIndex = nextIndex;
    const buttons = results.querySelectorAll("[data-ks-search-result]");
    buttons.forEach((button, index) => {
      button.classList.toggle("is-active", index === activeIndex);
    });
  }

  function renderMatches() {
    const query = input.value.trim();
    if (!query) {
      hideResults();
      return;
    }

    matches = entries
      .map((entry) => ({ ...entry, score: fuzzyScore(query, entry.path) }))
      .filter((entry) => entry.score >= 0)
      .sort((a, b) => b.score - a.score || a.path.length - b.path.length || a.path.localeCompare(b.path))
      .slice(0, 8);

    if (matches.length === 0) {
      results.innerHTML = '<div class="ks-search-empty">No matching fields</div>';
      results.hidden = false;
      activeIndex = -1;
      return;
    }

    results.innerHTML = matches.map((entry, index) => (
      '<button type="button" class="ks-search-result' + (index === 0 ? ' is-active' : '') + '" data-ks-search-result data-node-id="' + escapeHtml(entry.nodeId) + '">' +
        '<span class="ks-search-result-path">' + escapeHtml(entry.path) + '</span>' +
        '<span class="ks-search-result-type">' + escapeHtml(entry.propType || "field") + '</span>' +
      '</button>'
    )).join("");
    results.hidden = false;
    activeIndex = 0;
  }

  function clearHighlight() {
    shadow.querySelectorAll(".ks-search-hit").forEach((element) => {
      element.classList.remove("ks-search-hit");
    });
  }

  function setActiveNode(entry) {
    if (!entry) {
      return;
    }
    if (activeNodeId) {
      const current = nodeByID.get(activeNodeId);
      if (current) {
        current.classList.remove("is-active");
      }
    }
    const next = nodeByID.get(entry.nodeId);
    if (!next) {
      return;
    }
    next.classList.add("is-active");
    activeNodeId = entry.nodeId;
    if (detailPanel) {
      // Panels are shared by every field of the same shape, so the path is
      // filled in here from the row that was selected.
      const panelTemplate = panelTemplateByID.get(next.getAttribute("data-ks-panel"));
      if (panelTemplate) {
        const panel = panelTemplate.content.cloneNode(true);
        const pathSlot = panel.querySelector("[data-ks-detail-path]");
        if (pathSlot) {
          pathSlot.textContent = entry.path;
        }
        detailPanel.replaceChildren(panel);
      } else {
        detailPanel.replaceChildren();
      }
    }
  }

  // Single place that opens or closes a subtree, so the badge's aria-expanded
  // can never drift out of step with what the tree is actually showing. Every
  // path that changes visibility (row click, badge, ctrl-click, search, deep
  // links) goes through here.
  function setChildrenOpen(container, open) {
    if (!container) {
      return;
    }
    container.hidden = !open;
    const toggle = toggleByTarget.get(container.id);
    if (toggle) {
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
  }

  function revealNode(node) {
    let current = node;
    while (current && current !== root) {
      if (current.hasAttribute && current.hasAttribute("data-ks-children-container")) {
        setChildrenOpen(current, true);
      }
      current = current.parentElement;
    }
  }

  function setHash(path) {
    const nextHash = "#" + encodeURIComponent(path);
    if (window.location.hash === nextHash) {
      return;
    }
    if (window.history && typeof window.history.replaceState === "function") {
      window.history.replaceState(null, "", nextHash);
      return;
    }
    window.location.hash = path;
  }

  function selectEntry(entry, options = {}) {
    const { updateHash = false, scroll = true } = options;
    const node = nodeByID.get(entry.nodeId);
    if (!node) {
      return;
    }
    revealNode(node);
    setActiveNode(entry);
    clearHighlight();
    node.classList.add("ks-search-hit");
    window.clearTimeout(highlightTimer);
    highlightTimer = window.setTimeout(clearHighlight, 1800);
    if (scroll) {
      node.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    input.value = entry.path;
    hideResults();
    if (updateHash) {
      setHash(entry.path);
    }
  }

  function selectHashTarget() {
    const rawHash = window.location.hash.replace(/^#/, "");
    if (!rawHash) {
      if (entries.length > 0) {
        selectEntry(entries[0], { scroll: false });
      }
      return;
    }
    const entry = entryByPath.get(normalize(decodeURIComponent(rawHash)));
    if (entry) {
      selectEntry(entry);
      return;
    }
    if (entries.length > 0) {
      selectEntry(entries[0], { scroll: false });
    }
  }

  function toggleSubtree(control) {
    const row = control.closest(".ks-row");
    if (!row) {
      return;
    }
    const childContainers = Array.from(row.querySelectorAll("[data-ks-children-container]"));
    if (childContainers.length === 0) {
      return;
    }
    const shouldOpen = childContainers.some((candidate) => candidate.hasAttribute("hidden"));
    childContainers.forEach((candidate) => {
      setChildrenOpen(candidate, shouldOpen);
    });
  }

  input.addEventListener("input", renderMatches);
  input.addEventListener("focus", () => {
    if (input.value.trim()) {
      renderMatches();
    }
  });
  input.addEventListener("keydown", (event) => {
    if (results.hidden || matches.length === 0) {
      return;
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      setActiveIndex((activeIndex + 1) % matches.length);
      return;
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      setActiveIndex((activeIndex - 1 + matches.length) % matches.length);
      return;
    }
    if (event.key === "Enter" && activeIndex >= 0) {
      event.preventDefault();
      selectEntry(matches[activeIndex]);
      return;
    }
    if (event.key === "Escape") {
      hideResults();
    }
  });

  results.addEventListener("mousedown", (event) => {
    event.preventDefault();
  });
  results.addEventListener("click", (event) => {
    const target = event.target;
    const button = target instanceof Element ? target.closest("[data-node-id]") : null;
    if (!button) {
      return;
    }
    const entry = matches.find((candidate) => candidate.nodeId === button.getAttribute("data-node-id"));
    if (entry) {
      selectEntry(entry);
    }
  });

  document.addEventListener("click", (event) => {
    if (!host.contains(event.target)) {
      hideResults();
    }
  });
  typeButtons.forEach((typeButton) => {
    typeButton.addEventListener("click", (event) => {
      event.stopPropagation();
      if (event.ctrlKey || event.metaKey) {
        event.preventDefault();
        toggleSubtree(typeButton);
        return;
      }
      const children = childrenByID.get(typeButton.getAttribute("data-ks-children-target"));
      if (children) {
        setChildrenOpen(children, children.hidden);
      }
    });
  });
  root.addEventListener("click", (event) => {
    const target = event.target;
    if (target instanceof Element && target.closest("button")) {
      return;
    }
    const selectable = target instanceof Element ? target.closest(".ks-row-line") : null;
    if (!selectable || !root.contains(selectable)) {
      return;
    }
    const path = selectable.getAttribute("data-ks-path");
    if (!path) {
      return;
    }
    if (event.ctrlKey || event.metaKey) {
      return;
    }
    // Clicking the field itself opens or closes it. Selecting still happens, so
    // one click both reveals the children and puts the field in the detail pane.
    const children = selectable.nextElementSibling;
    if (children && children.hasAttribute("data-ks-children-container")) {
      setChildrenOpen(children, children.hidden);
    }
    setHash(path);
    const entry = entryByPath.get(normalize(path));
    if (entry) {
      selectEntry(entry, { scroll: false });
    }
  });
  window.addEventListener("hashchange", selectHashTarget);
  selectHashTarget();
})();
</script>
