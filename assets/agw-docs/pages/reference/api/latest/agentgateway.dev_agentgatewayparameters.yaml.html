<template data-ks-field-panel="p0"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">APIVersion defines the versioned schema of this representation of an object.<br />Servers should convert recognized schemas to the latest internal value, and<br />may reject unrecognized values.<br />More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources</div></div></div></template>
<template data-ks-field-panel="p1"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Kind is a string value representing the REST resource this object represents.<br />Servers may infer this from the endpoint the client submits requests to.<br />Cannot be updated.<br />In CamelCase.<br />More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds</div></div></div></template>

<template data-ks-field-panel="p3"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span><span class="ks-detail-required">Required</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Desired data plane provisioning settings.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Rule</span><div class="ks-validation-value ks-validation-value-block">deployment overlays are only valid when workload.kind is Deployment or unset</div></div><div class="ks-validation-item"><span class="ks-validation-label">Rule</span><div class="ks-validation-value ks-validation-value-block">daemonSet overlays are only valid when workload.kind is DaemonSet</div></div><div class="ks-validation-item"><span class="ks-validation-label">Rule</span><div class="ks-validation-value ks-validation-value-block">horizontalPodAutoscaler is not valid when workload.kind is DaemonSet</div></div></div></details></div></template>
<template data-ks-field-panel="p4"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Overrides for the generated<br /><code class="ks-inline-code">DaemonSet</code> resource.</div></div><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (2)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/customize/">documentation/setup/customize/customize</a></div></div></details></div></template>
<template data-ks-field-panel="p5"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block"><code class="ks-inline-code">metadata</code> defines a subset of object metadata to be customized.<br /><code class="ks-inline-code">labels</code> and <code class="ks-inline-code">annotations</code> are merged with existing values. If both<br /><code class="ks-inline-code">GatewayClass</code> and <code class="ks-inline-code">Gateway</code> parameters define the same label or<br />annotation key, the <code class="ks-inline-code">Gateway</code> value takes precedence (applied second).</div></div></div></template>
<template data-ks-field-panel="p6"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-object">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Annotations is an unstructured key value map stored with a resource that may be<br />set by external tools to store and retrieve arbitrary metadata. They are not<br />queryable and should be preserved when modifying objects.<br />More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations</div></div></div></template>
<template data-ks-field-panel="p7"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-object">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Map of string keys and values that can be used to organize and categorize<br />(scope and select) objects. May match selectors of replication controllers<br />and services.<br />More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels</div></div></div></template>
<template data-ks-field-panel="p8"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-object">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block"><code class="ks-inline-code">spec</code> provides an opaque mechanism to configure the resource spec.<br />This field accepts a complete or partial Kubernetes resource spec, such<br />as <code class="ks-inline-code">PodSpec</code> or <code class="ks-inline-code">ServiceSpec</code>, and will be merged with the generated<br />configuration using <strong class="ks-strong">Strategic Merge Patch</strong> semantics.</div><div class="ks-rich-heading ks-rich-h1">Application Order</div><div class="ks-rich-block">Overlays are applied after all typed configuration fields from both levels.<br />The full merge order is:</div><div class="ks-rich-block"> 1. <code class="ks-inline-code">GatewayClass</code> typed configuration fields<br /> 2. <code class="ks-inline-code">Gateway</code> typed configuration fields<br /> 3. <code class="ks-inline-code">GatewayClass</code> overlays<br /> 4. <code class="ks-inline-code">Gateway</code> overlays (can override all previous values)</div><div class="ks-rich-heading ks-rich-h1">Strategic Merge Patch &amp; Deletion Guide</div><div class="ks-rich-block">This merge strategy allows you to override individual fields, merge lists, or delete items<br />without needing to provide the entire resource definition.</div><div class="ks-rich-block"><strong class="ks-strong">1. Replacing Values (Scalars):</strong><br />Simple fields (strings, integers, booleans) in your config will overwrite the generated defaults.</div><div class="ks-rich-block"><strong class="ks-strong">2. Merging Lists (Append/Merge):</strong><br />Lists with &quot;merge keys&quot;, like <code class="ks-inline-code">containers</code> which merges on <code class="ks-inline-code">name</code>, or<br /><code class="ks-inline-code">tolerations</code> which merges on <code class="ks-inline-code">key</code>,<br />will append your items to the generated list, or update existing items if keys match.</div><div class="ks-rich-block"><strong class="ks-strong">3. Deleting Fields or List Items ($patch: delete):</strong><br />To remove a field or list item from the generated resource, use the<br /><code class="ks-inline-code">$patch: delete</code> directive. This works for both map fields and list items,<br />and is the recommended approach because it works with both client-side<br />and server-side apply.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      # Delete pod-level securityContext
      securityContext:
        $patch: delete
      # Delete nodeSelector
      nodeSelector:
        $patch: delete
      containers:
      # Be sure to use the correct proxy name here or you will add a
      # container instead of modifying a container.
      - name: proxy-name
        # Delete container-level securityContext
        securityContext:
          $patch: delete</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">4. Null Values (server-side apply only):</strong><br />Setting a field to <code class="ks-inline-code">null</code> can also remove it, but this ONLY works with<br /><code class="ks-inline-code">kubectl apply --server-side</code> or equivalent. With regular client-side<br /><code class="ks-inline-code">kubectl apply</code>, null values are stripped by kubectl before reaching<br />the API server, so the deletion won't occur. Prefer <code class="ks-inline-code">$patch: delete</code><br />for consistent behavior across both apply modes.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      nodeSelector: null  # Removes nodeSelector (server-side apply only!)</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">5. Replacing Maps Entirely ($patch: replace):</strong><br />To replace an entire map with your values (instead of merging), use <code class="ks-inline-code">$patch: replace</code>.<br />This removes all existing keys and replaces them with only your specified keys.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      nodeSelector:
        $patch: replace
        custom-key: custom-value</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">6. Replacing Lists Entirely ($patch: replace):</strong><br />If you want to strictly define a list and ignore all generated defaults, use <code class="ks-inline-code">$patch: replace</code>.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>service:
  spec:
    ports:
    - $patch: replace
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP</code></pre></div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Preserve unknown fields</span><span class="ks-validation-value">true</span></div></div></details><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (2)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/customize/">documentation/setup/customize/customize</a></div></div></details></div></template>

<template data-ks-field-panel="p13"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-object">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block"><code class="ks-inline-code">spec</code> provides an opaque mechanism to configure the resource spec.<br />This field accepts a complete or partial Kubernetes resource spec, such<br />as <code class="ks-inline-code">PodSpec</code> or <code class="ks-inline-code">ServiceSpec</code>, and will be merged with the generated<br />configuration using <strong class="ks-strong">Strategic Merge Patch</strong> semantics.</div><div class="ks-rich-heading ks-rich-h1">Application Order</div><div class="ks-rich-block">Overlays are applied after all typed configuration fields from both levels.<br />The full merge order is:</div><div class="ks-rich-block"> 1. <code class="ks-inline-code">GatewayClass</code> typed configuration fields<br /> 2. <code class="ks-inline-code">Gateway</code> typed configuration fields<br /> 3. <code class="ks-inline-code">GatewayClass</code> overlays<br /> 4. <code class="ks-inline-code">Gateway</code> overlays (can override all previous values)</div><div class="ks-rich-heading ks-rich-h1">Strategic Merge Patch &amp; Deletion Guide</div><div class="ks-rich-block">This merge strategy allows you to override individual fields, merge lists, or delete items<br />without needing to provide the entire resource definition.</div><div class="ks-rich-block"><strong class="ks-strong">1. Replacing Values (Scalars):</strong><br />Simple fields (strings, integers, booleans) in your config will overwrite the generated defaults.</div><div class="ks-rich-block"><strong class="ks-strong">2. Merging Lists (Append/Merge):</strong><br />Lists with &quot;merge keys&quot;, like <code class="ks-inline-code">containers</code> which merges on <code class="ks-inline-code">name</code>, or<br /><code class="ks-inline-code">tolerations</code> which merges on <code class="ks-inline-code">key</code>,<br />will append your items to the generated list, or update existing items if keys match.</div><div class="ks-rich-block"><strong class="ks-strong">3. Deleting Fields or List Items ($patch: delete):</strong><br />To remove a field or list item from the generated resource, use the<br /><code class="ks-inline-code">$patch: delete</code> directive. This works for both map fields and list items,<br />and is the recommended approach because it works with both client-side<br />and server-side apply.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      # Delete pod-level securityContext
      securityContext:
        $patch: delete
      # Delete nodeSelector
      nodeSelector:
        $patch: delete
      containers:
      # Be sure to use the correct proxy name here or you will add a
      # container instead of modifying a container.
      - name: proxy-name
        # Delete container-level securityContext
        securityContext:
          $patch: delete</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">4. Null Values (server-side apply only):</strong><br />Setting a field to <code class="ks-inline-code">null</code> can also remove it, but this ONLY works with<br /><code class="ks-inline-code">kubectl apply --server-side</code> or equivalent. With regular client-side<br /><code class="ks-inline-code">kubectl apply</code>, null values are stripped by kubectl before reaching<br />the API server, so the deletion won't occur. Prefer <code class="ks-inline-code">$patch: delete</code><br />for consistent behavior across both apply modes.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      nodeSelector: null  # Removes nodeSelector (server-side apply only!)</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">5. Replacing Maps Entirely ($patch: replace):</strong><br />To replace an entire map with your values (instead of merging), use <code class="ks-inline-code">$patch: replace</code>.<br />This removes all existing keys and replaces them with only your specified keys.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      nodeSelector:
        $patch: replace
        custom-key: custom-value</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">6. Replacing Lists Entirely ($patch: replace):</strong><br />If you want to strictly define a list and ignore all generated defaults, use <code class="ks-inline-code">$patch: replace</code>.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>service:
  spec:
    ports:
    - $patch: replace
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP</code></pre></div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Preserve unknown fields</span><span class="ks-validation-value">true</span></div></div></details><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (3)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/customize/">documentation/setup/customize/customize</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../integrations/llm/providers/azure/">integrations/llm/providers/azure</a></div></div></details></div></template>
<template data-ks-field-panel="p14"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object[]</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Container environment variables. These override any existing<br />values. If you want to delete an environment variable entirely, use<br /><code class="ks-inline-code">$patch: delete</code> with an overlay instead. Note that<br />[variable<br />expansion](https://kubernetes.io/docs/tasks/inject-data-application/define-interdependent-environment-variables/)<br />does apply, but is highly discouraged -- to set dependent environment<br />variables, you can use <code class="ks-inline-code">$(VAR_NAME)</code>, but it's highly discouraged.<br /><code class="ks-inline-code">$$(VAR_NAME)</code> avoids expansion and results in a literal<br /><code class="ks-inline-code">$(VAR_NAME)</code>.</div><div class="ks-rich-block">If <code class="ks-inline-code">SESSION_KEY</code> is specified, it takes precedence over the<br />controller-managed per-<code class="ks-inline-code">Gateway</code> session key <code class="ks-inline-code">Secret</code>.</div></div><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (2)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/llm/guardrails/webhook/guardrails/">documentation/llm/guardrails/webhook/guardrails</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div></div></details></div></template>

<template data-ks-field-panel="p16"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Variable references $(VAR_NAME) are expanded<br />using the previously defined environment variables in the container and<br />any service environment variables. If a variable cannot be resolved,<br />the reference in the input string will be unchanged. Double $$ are reduced<br />to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.<br />&quot;$$(VAR_NAME)&quot; will produce the string literal &quot;$(VAR_NAME)&quot;.<br />Escaped references will never be expanded, regardless of whether the variable<br />exists or not.<br />Defaults to &quot;&quot;.</div></div><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (2)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/llm/guardrails/webhook/guardrails/">documentation/llm/guardrails/webhook/guardrails</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div></div></details></div></template>

<template data-ks-field-panel="p70"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block"><code class="ks-inline-code">metadata</code> defines a subset of object metadata to be customized.<br /><code class="ks-inline-code">labels</code> and <code class="ks-inline-code">annotations</code> are merged with existing values. If both<br /><code class="ks-inline-code">GatewayClass</code> and <code class="ks-inline-code">Gateway</code> parameters define the same label or<br />annotation key, the <code class="ks-inline-code">Gateway</code> value takes precedence (applied second).</div></div><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (2)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../integrations/llm/providers/azure/">integrations/llm/providers/azure</a></div></div></details></div></template>

<template data-ks-field-panel="p72"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-object">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block"><code class="ks-inline-code">spec</code> provides an opaque mechanism to configure the resource spec.<br />This field accepts a complete or partial Kubernetes resource spec, such<br />as <code class="ks-inline-code">PodSpec</code> or <code class="ks-inline-code">ServiceSpec</code>, and will be merged with the generated<br />configuration using <strong class="ks-strong">Strategic Merge Patch</strong> semantics.</div><div class="ks-rich-heading ks-rich-h1">Application Order</div><div class="ks-rich-block">Overlays are applied after all typed configuration fields from both levels.<br />The full merge order is:</div><div class="ks-rich-block"> 1. <code class="ks-inline-code">GatewayClass</code> typed configuration fields<br /> 2. <code class="ks-inline-code">Gateway</code> typed configuration fields<br /> 3. <code class="ks-inline-code">GatewayClass</code> overlays<br /> 4. <code class="ks-inline-code">Gateway</code> overlays (can override all previous values)</div><div class="ks-rich-heading ks-rich-h1">Strategic Merge Patch &amp; Deletion Guide</div><div class="ks-rich-block">This merge strategy allows you to override individual fields, merge lists, or delete items<br />without needing to provide the entire resource definition.</div><div class="ks-rich-block"><strong class="ks-strong">1. Replacing Values (Scalars):</strong><br />Simple fields (strings, integers, booleans) in your config will overwrite the generated defaults.</div><div class="ks-rich-block"><strong class="ks-strong">2. Merging Lists (Append/Merge):</strong><br />Lists with &quot;merge keys&quot;, like <code class="ks-inline-code">containers</code> which merges on <code class="ks-inline-code">name</code>, or<br /><code class="ks-inline-code">tolerations</code> which merges on <code class="ks-inline-code">key</code>,<br />will append your items to the generated list, or update existing items if keys match.</div><div class="ks-rich-block"><strong class="ks-strong">3. Deleting Fields or List Items ($patch: delete):</strong><br />To remove a field or list item from the generated resource, use the<br /><code class="ks-inline-code">$patch: delete</code> directive. This works for both map fields and list items,<br />and is the recommended approach because it works with both client-side<br />and server-side apply.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      # Delete pod-level securityContext
      securityContext:
        $patch: delete
      # Delete nodeSelector
      nodeSelector:
        $patch: delete
      containers:
      # Be sure to use the correct proxy name here or you will add a
      # container instead of modifying a container.
      - name: proxy-name
        # Delete container-level securityContext
        securityContext:
          $patch: delete</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">4. Null Values (server-side apply only):</strong><br />Setting a field to <code class="ks-inline-code">null</code> can also remove it, but this ONLY works with<br /><code class="ks-inline-code">kubectl apply --server-side</code> or equivalent. With regular client-side<br /><code class="ks-inline-code">kubectl apply</code>, null values are stripped by kubectl before reaching<br />the API server, so the deletion won't occur. Prefer <code class="ks-inline-code">$patch: delete</code><br />for consistent behavior across both apply modes.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      nodeSelector: null  # Removes nodeSelector (server-side apply only!)</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">5. Replacing Maps Entirely ($patch: replace):</strong><br />To replace an entire map with your values (instead of merging), use <code class="ks-inline-code">$patch: replace</code>.<br />This removes all existing keys and replaces them with only your specified keys.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>spec:
  template:
    spec:
      nodeSelector:
        $patch: replace
        custom-key: custom-value</code></pre></div><div class="ks-rich-block"><strong class="ks-strong">6. Replacing Lists Entirely ($patch: replace):</strong><br />If you want to strictly define a list and ignore all generated defaults, use <code class="ks-inline-code">$patch: replace</code>.</div><div class="ks-code-wrap"><pre class="ks-code-block"><code>service:
  spec:
    ports:
    - $patch: replace
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP</code></pre></div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Preserve unknown fields</span><span class="ks-validation-value">true</span></div></div></details></div></template>
<template data-ks-field-panel="p73"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Shutdown delay configuration. How graceful planned or unplanned data<br />plane changes happen is in tension with how quickly rollouts of the data<br />plane complete. How long a data plane pod must wait for shutdown to be<br />perfectly graceful depends on how you have configured your <code class="ks-inline-code">Gateway</code><br />resources.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Rule</span><div class="ks-validation-value ks-validation-value-block">The 'min' value must be less than or equal to the 'max' value.</div></div></div></details><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (1)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div></div></details></div></template>
<template data-ks-field-panel="p74"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-integer">integer</span><span class="ks-detail-required">Required</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Maximum time (in seconds) to wait before allowing Agentgateway to<br />terminate. Refer to the <code class="ks-inline-code">TERMINATION_GRACE_PERIOD_SECONDS</code><br />environment variable for details.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Format</span><span class="ks-validation-value">int64</span></div><div class="ks-validation-item"><span class="ks-validation-label">Minimum</span><span class="ks-validation-value">0</span></div><div class="ks-validation-item"><span class="ks-validation-label">Maximum</span><span class="ks-validation-value">31536000</span></div></div></details><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (1)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div></div></details></div></template>
<template data-ks-field-panel="p75"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-integer">integer</span><span class="ks-detail-required">Required</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Minimum time (in seconds) to wait before allowing Agentgateway to<br />terminate. Refer to the <code class="ks-inline-code">CONNECTION_MIN_TERMINATION_DEADLINE</code><br />environment variable for details.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Format</span><span class="ks-validation-value">int64</span></div><div class="ks-validation-item"><span class="ks-validation-label">Minimum</span><span class="ks-validation-value">0</span></div><div class="ks-validation-item"><span class="ks-validation-label">Maximum</span><span class="ks-validation-value">31536000</span></div></div></details><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (1)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div></div></details></div></template>
<template data-ks-field-panel="p76"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">SPIFFE integration settings. When set, the gateway sources its TLS identity (X.509-SVID)<br />and trust bundle from the local SPIFFE Workload API, and the controller<br />mounts the Workload API socket into the pod. Listeners and backends opt in to SPIFFE individually<br />(via the <code class="ks-inline-code">agentgateway.dev/tls-certificate-source: SPIFFE</code> listener option and the<br />AgentgatewayPolicy <code class="ks-inline-code">backend.tls.certificateSource: SPIFFE</code> field respectively).</div></div></div></template>
<template data-ks-field-panel="p77"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-boolean">boolean</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Explicitly turns SPIFFE integration on or off for this gateway. When unset, the presence<br />of the spiffe block opts in. Set to false on a Gateway-level AgentgatewayParameters to opt<br />a gateway out of SPIFFE enabled at the GatewayClass level.</div></div></div></template>

<template data-ks-field-panel="p85"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-complex">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block"><code class="ks-inline-code">workload</code> selects the Kubernetes workload kind for the managed Gateway<br />data plane. If unset, Deployment is used.</div></div><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (2)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/customize/">documentation/setup/customize/customize</a></div></div></details></div></template>
<template data-ks-field-panel="p86"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-string">string</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Kind selects the Kubernetes workload kind. When unset, Deployment is used.</div></div><details class="ks-validation"><summary class="ks-validation-summary">Validation</summary><div class="ks-validation-body"><div class="ks-validation-item"><span class="ks-validation-label">Enum</span><span class="ks-validation-value">DaemonSet, Deployment</span></div></div></details><details class="ks-validation ks-documentation"><summary class="ks-validation-summary">Documentation References (2)</summary><div class="ks-validation-body"><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/configs/">documentation/setup/customize/configs</a></div><div class="ks-doc-link-row"><a class="ks-doc-link" href="../../../documentation/setup/customize/customize/">documentation/setup/customize/customize</a></div></div></details></div></template>
<template data-ks-field-panel="p87"><div class="ks-detail-card"><div class="ks-detail-path" data-ks-detail-path></div><div class="ks-detail-meta-line"><span class="ks-detail-type ks-type-object">object</span></div><div class="ks-detail-desc"><div class="ks-rich-block">Current status for these provisioning settings.</div></div></div></template>

</div>
</template>
<script>
(() => {
  const host = document.getElementById("ks-widget-1");
  const template = document.getElementById("ks-widget-1-template");
  if (!host || !template || host.dataset.ksWidgetReady === "true") {
    return;
  }
  host.dataset.ksWidgetReady = "true";

  const shadow = host.shadowRoot || host.attachShadow({ mode: "open" });
  shadow.innerHTML = "";
  shadow.appendChild(template.content.cloneNode(true));

  const root = shadow.querySelector(".ks-schema");
  if (!root) {
    return;
  }

  // Dark mode sync: mirror Hextra's html.dark class onto the shadow root so
  // the encapsulated CSS can react. MutationObserver covers theme toggling.
  const docEl = document.documentElement;
  const syncDark = () => {
    root.classList.toggle("ks-dark", docEl.classList.contains("dark"));
  };
  syncDark();
  new MutationObserver(syncDark).observe(docEl, { attributes: true, attributeFilter: ["class"] });

  // The search index is read out of the tree rather than shipped beside it.
  // Every field of an entry is already an attribute on the row, and the literal
  // cost ~170 bytes per field, which on the standalone config schema was 4.8 MB
  // of the page. querySelectorAll returns document order, so entries[0] is
  // still the root field.
  const entries = Array.from(shadow.querySelectorAll(".ks-row-line[data-ks-path]")).map((element) => {
    const badge = element.querySelector(".ks-type");
    return {
      nodeId: element.id,
      path: element.getAttribute("data-ks-path"),
      propType: badge ? badge.textContent : "",
    };
  });
  const input = shadow.querySelector("[data-ks-search-input]");
  const results = shadow.querySelector("[data-ks-search-results]");
  const detailPanel = shadow.querySelector("[data-ks-active-panel]");
  if (!input || !results || entries.length === 0) {
    return;
  }
  const nodeByID = new Map();
  const childrenByID = new Map();
  const panelTemplateByID = new Map();
  shadow.querySelectorAll(".ks-row-line[id]").forEach((element) => {
    nodeByID.set(element.id, element);
  });
  shadow.querySelectorAll("[data-ks-children-container]").forEach((element) => {
    childrenByID.set(element.id, element);
  });
  shadow.querySelectorAll("[data-ks-field-panel]").forEach((element) => {
    panelTemplateByID.set(element.getAttribute("data-ks-field-panel"), element);
  });
  const entryByPath = new Map(entries.map((entry) => [normalize(entry.path), entry]));
  const typeButtons = shadow.querySelectorAll(".ks-type-toggle[data-ks-children-target]");
  const toggleByTarget = new Map();
  typeButtons.forEach((element) => {
    toggleByTarget.set(element.getAttribute("data-ks-children-target"), element);
  });

  let matches = [];
  let activeIndex = -1;
  let highlightTimer = 0;
  let activeNodeId = "";

  function normalize(value) {
    return value.toLowerCase().trim().replace(/^\./, "");
  }

  function scoreSegment(query, target) {
    if (!query) {
      return 0;
    }
    let qi = 0;
    let score = 0;
    let streak = 0;
    let lastIndex = -1;
    for (let i = 0; i < target.length && qi < query.length; i += 1) {
      if (target[i] !== query[qi]) {
        continue;
      }
      score += 1;
      if (i === 0) {
        score += 12;
      }
      if (lastIndex === i - 1) {
        streak += 1;
        score += 8 + Math.min(streak, 4);
      } else {
        streak = 0;
      }
      lastIndex = i;
      qi += 1;
    }
    if (qi !== query.length) {
      return -1;
    }
    if (target.startsWith(query)) {
      score += 18;
    }
    return score - (target.length - query.length);
  }

  function fuzzyScore(query, target) {
    const queryParts = normalize(query).split(".").filter(Boolean);
    const targetParts = normalize(target).split(".").filter(Boolean);
    if (queryParts.length === 0) {
      return -1;
    }

    let total = 0;
    let searchFrom = 0;
    for (const queryPart of queryParts) {
      let bestIndex = -1;
      let bestScore = -1;
      for (let i = searchFrom; i < targetParts.length; i += 1) {
        const partScore = scoreSegment(queryPart, targetParts[i]);
        if (partScore > bestScore) {
          bestIndex = i;
          bestScore = partScore;
        }
        if (targetParts[i].startsWith(queryPart)) {
          break;
        }
      }
      if (bestIndex === -1 || bestScore < 0) {
        return -1;
      }
      total += bestScore;
      if (bestIndex === searchFrom) {
        total += 6;
      }
      searchFrom = bestIndex + 1;
    }

    const normalizedTarget = normalize(target);
    const normalizedQuery = normalize(query);
    if (normalizedTarget.startsWith(normalizedQuery)) {
      total += 24;
    }
    return total - Math.max(0, targetParts.length - queryParts.length);
  }

  function escapeHtml(value) {
    return value
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function hideResults() {
    results.hidden = true;
    results.innerHTML = "";
    matches = [];
    activeIndex = -1;
  }

  function setActiveIndex(nextIndex) {
    activeIndex = nextIndex;
    const buttons = results.querySelectorAll("[data-ks-search-result]");
    buttons.forEach((button, index) => {
      button.classList.toggle("is-active", index === activeIndex);
    });
  }

  function renderMatches() {
    const query = input.value.trim();
    if (!query) {
      hideResults();
      return;
    }

    matches = entries
      .map((entry) => ({ ...entry, score: fuzzyScore(query, entry.path) }))
      .filter((entry) => entry.score >= 0)
      .sort((a, b) => b.score - a.score || a.path.length - b.path.length || a.path.localeCompare(b.path))
      .slice(0, 8);

    if (matches.length === 0) {
      results.innerHTML = '<div class="ks-search-empty">No matching fields</div>';
      results.hidden = false;
      activeIndex = -1;
      return;
    }

    results.innerHTML = matches.map((entry, index) => (
      '<button type="button" class="ks-search-result' + (index === 0 ? ' is-active' : '') + '" data-ks-search-result data-node-id="' + escapeHtml(entry.nodeId) + '">' +
        '<span class="ks-search-result-path">' + escapeHtml(entry.path) + '</span>' +
        '<span class="ks-search-result-type">' + escapeHtml(entry.propType || "field") + '</span>' +
      '</button>'
    )).join("");
    results.hidden = false;
    activeIndex = 0;
  }

  function clearHighlight() {
    shadow.querySelectorAll(".ks-search-hit").forEach((element) => {
      element.classList.remove("ks-search-hit");
    });
  }

  function setActiveNode(entry) {
    if (!entry) {
      return;
    }
    if (activeNodeId) {
      const current = nodeByID.get(activeNodeId);
      if (current) {
        current.classList.remove("is-active");
      }
    }
    const next = nodeByID.get(entry.nodeId);
    if (!next) {
      return;
    }
    next.classList.add("is-active");
    activeNodeId = entry.nodeId;
    if (detailPanel) {
      // Panels are shared by every field of the same shape, so the path is
      // filled in here from the row that was selected.
      const panelTemplate = panelTemplateByID.get(next.getAttribute("data-ks-panel"));
      if (panelTemplate) {
        const panel = panelTemplate.content.cloneNode(true);
        const pathSlot = panel.querySelector("[data-ks-detail-path]");
        if (pathSlot) {
          pathSlot.textContent = entry.path;
        }
        detailPanel.replaceChildren(panel);
      } else {
        detailPanel.replaceChildren();
      }
    }
  }

  // Single place that opens or closes a subtree, so the badge's aria-expanded
  // can never drift out of step with what the tree is actually showing. Every
  // path that changes visibility (row click, badge, ctrl-click, search, deep
  // links) goes through here.
  function setChildrenOpen(container, open) {
    if (!container) {
      return;
    }
    container.hidden = !open;
    const toggle = toggleByTarget.get(container.id);
    if (toggle) {
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
  }

  function revealNode(node) {
    let current = node;
    while (current && current !== root) {
      if (current.hasAttribute && current.hasAttribute("data-ks-children-container")) {
        setChildrenOpen(current, true);
      }
      current = current.parentElement;
    }
  }

  function setHash(path) {
    const nextHash = "#" + encodeURIComponent(path);
    if (window.location.hash === nextHash) {
      return;
    }
    if (window.history && typeof window.history.replaceState === "function") {
      window.history.replaceState(null, "", nextHash);
      return;
    }
    window.location.hash = path;
  }

  function selectEntry(entry, options = {}) {
    const { updateHash = false, scroll = true } = options;
    const node = nodeByID.get(entry.nodeId);
    if (!node) {
      return;
    }
    revealNode(node);
    setActiveNode(entry);
    clearHighlight();
    node.classList.add("ks-search-hit");
    window.clearTimeout(highlightTimer);
    highlightTimer = window.setTimeout(clearHighlight, 1800);
    if (scroll) {
      node.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    input.value = entry.path;
    hideResults();
    if (updateHash) {
      setHash(entry.path);
    }
  }

  function selectHashTarget() {
    const rawHash = window.location.hash.replace(/^#/, "");
    if (!rawHash) {
      if (entries.length > 0) {
        selectEntry(entries[0], { scroll: false });
      }
      return;
    }
    const entry = entryByPath.get(normalize(decodeURIComponent(rawHash)));
    if (entry) {
      selectEntry(entry);
      return;
    }
    if (entries.length > 0) {
      selectEntry(entries[0], { scroll: false });
    }
  }

  function toggleSubtree(control) {
    const row = control.closest(".ks-row");
    if (!row) {
      return;
    }
    const childContainers = Array.from(row.querySelectorAll("[data-ks-children-container]"));
    if (childContainers.length === 0) {
      return;
    }
    const shouldOpen = childContainers.some((candidate) => candidate.hasAttribute("hidden"));
    childContainers.forEach((candidate) => {
      setChildrenOpen(candidate, shouldOpen);
    });
  }

  input.addEventListener("input", renderMatches);
  input.addEventListener("focus", () => {
    if (input.value.trim()) {
      renderMatches();
    }
  });
  input.addEventListener("keydown", (event) => {
    if (results.hidden || matches.length === 0) {
      return;
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      setActiveIndex((activeIndex + 1) % matches.length);
      return;
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      setActiveIndex((activeIndex - 1 + matches.length) % matches.length);
      return;
    }
    if (event.key === "Enter" && activeIndex >= 0) {
      event.preventDefault();
      selectEntry(matches[activeIndex]);
      return;
    }
    if (event.key === "Escape") {
      hideResults();
    }
  });

  results.addEventListener("mousedown", (event) => {
    event.preventDefault();
  });
  results.addEventListener("click", (event) => {
    const target = event.target;
    const button = target instanceof Element ? target.closest("[data-node-id]") : null;
    if (!button) {
      return;
    }
    const entry = matches.find((candidate) => candidate.nodeId === button.getAttribute("data-node-id"));
    if (entry) {
      selectEntry(entry);
    }
  });

  document.addEventListener("click", (event) => {
    if (!host.contains(event.target)) {
      hideResults();
    }
  });
  typeButtons.forEach((typeButton) => {
    typeButton.addEventListener("click", (event) => {
      event.stopPropagation();
      if (event.ctrlKey || event.metaKey) {
        event.preventDefault();
        toggleSubtree(typeButton);
        return;
      }
      const children = childrenByID.get(typeButton.getAttribute("data-ks-children-target"));
      if (children) {
        setChildrenOpen(children, children.hidden);
      }
    });
  });
  root.addEventListener("click", (event) => {
    const target = event.target;
    if (target instanceof Element && target.closest("button")) {
      return;
    }
    const selectable = target instanceof Element ? target.closest(".ks-row-line") : null;
    if (!selectable || !root.contains(selectable)) {
      return;
    }
    const path = selectable.getAttribute("data-ks-path");
    if (!path) {
      return;
    }
    if (event.ctrlKey || event.metaKey) {
      return;
    }
    // Clicking the field itself opens or closes it. Selecting still happens, so
    // one click both reveals the children and puts the field in the detail pane.
    const children = selectable.nextElementSibling;
    if (children && children.hasAttribute("data-ks-children-container")) {
      setChildrenOpen(children, children.hidden);
    }
    setHash(path);
    const entry = entryByPath.get(normalize(path));
    if (entry) {
      selectEntry(entry, { scroll: false });
    }
  });
  window.addEventListener("hashchange", selectHashTarget);
  selectHashTarget();
})();
</script>
