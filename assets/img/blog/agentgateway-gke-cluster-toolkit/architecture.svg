<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 545" font-family="Figtree, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Private multi-LLM routing on GKE with agentgateway</title>
  <desc id="description">Clients in a VPC or connected network reach an internal GKE load balancer. It forwards requests to agentgateway, which routes by path to Gemini by default and optionally to OpenAI or Anthropic. Gemini uses Workload Identity; external providers use Kubernetes Secrets.</desc>
  <defs>
    <linearGradient id="gatewayGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="25" y="64" width="765" height="454" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="812" y="64" width="366" height="454" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="50" y="103" font-size="20" font-weight="700" fill="#0F172A">Private client-to-gateway path on GKE</text>
  <text x="868" y="103" font-size="20" font-weight="700" fill="#0F172A">Model providers</text>

  <g fill="none" stroke="#94A3B8" stroke-width="2.5">
    <line x1="217" y1="287" x2="258" y2="287" marker-end="url(#arrow)"/>
    <line x1="473" y1="287" x2="516" y2="287" marker-end="url(#arrow)"/>
    <path d="M758,230 C796,230 798,164 825,164" marker-end="url(#arrow)"/>
    <line x1="758" y1="294" x2="825" y2="294" marker-end="url(#arrow)"/>
    <path d="M758,358 C796,358 798,424 825,424" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="49" y="231" width="168" height="112" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="133" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Apps &amp; agents</text>
  <text x="133" y="299" text-anchor="middle" font-size="15" fill="#64748B">VPC or connected</text>
  <text x="133" y="320" text-anchor="middle" font-size="15" fill="#64748B">network</text>

  <g filter="url(#softShadow)">
    <rect x="260" y="211" width="213" height="152" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="260" y="211" width="6" height="152" rx="3" fill="#7C3AED"/>
  <text x="282" y="255" font-size="20" font-weight="700" fill="#0F172A">Internal ALB</text>
  <text x="282" y="282" font-size="16" fill="#5B21B6">GKE Gateway</text>
  <text x="282" y="310" font-size="15" fill="#64748B">private ingress</text>
  <text x="282" y="336" font-size="15" fill="#64748B">ClusterIP Service</text>

  <g filter="url(#softShadow)">
    <rect x="519" y="190" width="239" height="194" rx="16" fill="url(#gatewayGradient)"/>
  </g>
  <text x="639" y="239" text-anchor="middle" font-size="23" font-weight="800" fill="#FFFFFF">agentgateway</text>
  <text x="639" y="269" text-anchor="middle" font-size="16" fill="#FFFFFF" opacity="0.92">Gateway + HTTPRoutes</text>
  <text x="639" y="300" text-anchor="middle" font-size="16" fill="#FFFFFF" opacity="0.92">route by provider path</text>
  <rect x="554" y="325" width="169" height="31" rx="15" fill="#FFFFFF" opacity="0.17"/>
  <text x="639" y="346" text-anchor="middle" font-size="14" fill="#FFFFFF">proxy data plane</text>

  <g filter="url(#softShadow)">
    <rect x="829" y="119" width="334" height="91" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="829" y="119" width="6" height="91" rx="3" fill="#0F766E"/>
  <text x="851" y="149" font-size="19" font-weight="700" fill="#0F172A">Gemini</text>
  <text x="851" y="172" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0F766E">/v1/chat/completions</text>
  <text x="851" y="193" font-size="14" fill="#64748B">default · Workload Identity</text>

  <g filter="url(#softShadow)">
    <rect x="829" y="249" width="334" height="91" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="829" y="249" width="6" height="91" rx="3" fill="#7C3AED"/>
  <text x="851" y="279" font-size="19" font-weight="700" fill="#0F172A">OpenAI</text>
  <text x="851" y="302" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6D28D9">/openai/v1/chat/completions</text>
  <text x="851" y="323" font-size="14" fill="#64748B">optional · Kubernetes Secret</text>

  <g filter="url(#softShadow)">
    <rect x="829" y="379" width="334" height="91" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="829" y="379" width="6" height="91" rx="3" fill="#B45309"/>
  <text x="851" y="409" font-size="19" font-weight="700" fill="#0F172A">Anthropic</text>
  <text x="851" y="432" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#B45309">/v1/messages</text>
  <text x="851" y="453" font-size="14" fill="#64748B">optional · Kubernetes Secret</text>

  <g fill="#7C3AED" stroke="#FFFFFF" stroke-width="2">
    <circle cx="68" cy="231" r="16"/>
    <circle cx="279" cy="211" r="16"/>
    <circle cx="538" cy="190" r="16"/>
    <circle cx="841" cy="96" r="16"/>
  </g>
  <g fill="#FFFFFF" text-anchor="middle" font-size="15" font-weight="800">
    <text x="68" y="236">1</text>
    <text x="279" y="216">2</text>
    <text x="538" y="195">3</text>
    <text x="841" y="101">4</text>
  </g>

  <text x="50" y="486" font-size="16" fill="#475569">Cluster Toolkit provisions networking, GKE, IAM, Helm releases, and readiness checks.</text>
</svg>
